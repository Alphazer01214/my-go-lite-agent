<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiteAgent</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/platform/shell.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar" data-slot="top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <strong>LiteAgent</strong>
        <span id="host-status" class="host-status" data-state="connecting" role="status" aria-live="polite">连接中…</span>
      </div>
      <div class="topbar-actions">
        <button id="plugins-toggle" class="toolbar-button" type="button" aria-controls="plugins" aria-expanded="false" title="插件中心：启停、实例与设置（Esc 关闭）">
          插件中心
          <span id="plugin-count" class="count">0</span>
        </button>
        <button id="diagnostic-toggle" class="toolbar-button" type="button" disabled aria-controls="diagnostics" aria-expanded="false" title="诊断：暂无诊断信息">
          诊断
          <span id="diagnostic-count" class="count">0</span>
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside class="slot slot-left" data-slot="left" aria-label="左侧区域"></aside>
      <div class="col-resizer" data-resize="left" role="separator" aria-orientation="vertical" aria-label="调整左侧栏宽度（←→）" tabindex="0"></div>
      <main class="slot slot-center" data-slot="center" aria-label="中间区域"></main>
      <div class="col-resizer" data-resize="right" role="separator" aria-orientation="vertical" aria-label="调整右侧栏宽度（←→）" tabindex="0"></div>
      <aside class="slot slot-right" data-slot="right" aria-label="右侧区域"></aside>
    </div>

    <section class="slot slot-bottom" data-slot="bottom" aria-label="底部区域"></section>
  </div>

  <dialog id="plugins" class="plugin-drawer" aria-labelledby="plugin-drawer-title">
    <header class="plugin-drawer-header">
      <div class="plugin-drawer-heading">
        <strong id="plugin-drawer-title">插件中心</strong>
        <span id="plugin-summary">0 个插件</span>
      </div>
      <div class="plugin-drawer-actions">
        <button id="plugin-rescan" class="secondary-button" type="button">重新扫描</button>
        <button id="plugins-close" class="icon-button" type="button" aria-label="关闭插件中心" title="关闭插件中心">×</button>
      </div>
    </header>
    <div id="plugin-action-status" class="plugin-action-status" aria-live="polite"></div>
    <div class="plugin-drawer-body">
      <section class="plugin-graph-pane" aria-label="插件依赖图">
        <div class="graph-toolbar">
          <div class="graph-legend" aria-label="关系图例">
            <span><i class="legend-node legend-mounted"></i>运行中</span>
            <span><i class="legend-node legend-available"></i>未激活</span>
            <span><i class="legend-node legend-degraded"></i>失败或缺失</span>
            <span><i class="legend-line legend-mount"></i>装载</span>
            <span><i class="legend-line legend-depends"></i>硬依赖</span>
          </div>
          <span class="hint">点击节点查看详情，点击空白清除选择。</span>
        </div>
        <div id="plugin-graph" class="plugin-graph" aria-label="Host 与插件关系图"></div>
        <details class="plugin-edge-details">
          <summary>关系列表 <span id="plugin-edge-count" class="count">0</span></summary>
          <ul id="plugin-edge-list" class="plugin-edge-list" aria-label="Host 与插件关系列表"></ul>
        </details>
      </section>
      <aside id="plugin-detail" class="plugin-detail-pane" aria-label="插件详情"></aside>
    </div>
    <p id="plugin-selection-status" class="visually-hidden" aria-live="polite"></p>
  </dialog>

  <aside id="diagnostics" class="diagnostic-panel" hidden tabindex="-1" aria-label="诊断">
    <div class="diagnostic-header">
      <strong>诊断</strong>
      <div class="panel-actions">
        <span>非模态</span>
        <button id="diagnostic-close" class="icon-button" type="button" aria-label="关闭诊断面板" title="关闭诊断面板">×</button>
      </div>
    </div>
    <ul id="diagnostic-list"></ul>
  </aside>

  <script type="module" src="/platform/app.js"></script>
</body>
</html>
