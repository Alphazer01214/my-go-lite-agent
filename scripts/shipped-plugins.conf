# Shipped plugin groups — single source for scripts/build.sh and scripts/build.ps1
# (a release target is either a "core" autostart root, a scheme-pulled "tools",
# or a shipped-but-not-mounted "example" plugin).
#
# 核心件 (autostart: true in their own plugin.json): the Host startup roots.
# 只收录 plugins/<name>/ 下已有 plugin.json 的插件；没有 plugin.json的目录不是
# 可挂载插件，构建脚本会跳过并告警。
core: agent session llm-openai tools model-context sandbox file-tools shell-tools web-tools subagent
# 场景工具: 后续可按需加入非 autostart 的 Tool Provider。当前完整组合把
# tools、sandbox 和 Provider 都作为 autostart 根装载。
tools:
