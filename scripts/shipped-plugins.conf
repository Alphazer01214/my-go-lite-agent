# Shipped plugin groups — single source for scripts/build.sh and scripts/build.ps1
# (a release target is either a "core" autostart root, a scheme-pulled "tools",
# or a shipped-but-not-mounted "optional" plugin).
#
# 核心件 (autostart: true in their own plugin.json): the Host startup roots.
# 当前源码中 agent、session、llm-openai、prompter 有 plugin.json 与可构建入口；
# model-context、tools、file-tools、shell-tools、subagent 仍是待实现骨架。
# 构建会告警并跳过没有 plugin.json 的目录；实现时先补 plugin.json、ui/entry
# 和 config.example.json，再保留在本行。完整清单见
# docs/archive/progress/2026-10-30-agent-session-llm-handoff.md。
core: agent session llm-openai prompter model-context tools file-tools shell-tools subagent
# 场景工具: 当前没有非 autostart 的 Tool Provider，后续可按需加入。
tools:
# 可选件 (autostart: false): 随发行版交付，但不随 Host 启动。
# 从插件中心手动启动后才进入调用链。
# sandbox 目前同样只有 Go 骨架；补 plugin.json 后才会实际交付。
optional: sandbox
