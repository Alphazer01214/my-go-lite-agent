# Shipped plugin groups — single source for scripts/build.sh and scripts/build.ps1
# (a release target is either "core" autostart roots, a scheme-pulled "tools",
# or a shipped-but-not-mounted "example" plugin).
#
# 核四件 (autostart: true in their own plugin.json): the Host startup roots.
core: agent session llm-openai context-manager
# 场景工具: not autostart, pulled in by an Agent Scheme's dependsPlugins via
# Host ensurePlugins (ADR-0023).
tools: filetools shelltools sandbox skill-manager project-context webtools
# 示例/参考: shipped, but neither autostart nor pulled by any scheme.
example: echotool echo uidemo