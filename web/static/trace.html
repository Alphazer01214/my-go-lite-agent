<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>session trace — lite agent</title>
<style>
:root{
  /* Design tokens (ADR-0010): Panel Components consume these across the
     Shadow DOM boundary. Kept in sync with shell.html. */
  --la-bg:#0f1115; --la-panel:#161a22; --la-panel2:#12161f; --la-ink:#e8eaed; --la-dim:#9aa0a6;
  --la-accent:#7aa2f7; --la-line:#2a2f3a; --la-err:#f7768e; --la-ok:#9ece6a; --la-stop:#f7768e;
  --la-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --la-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--la-bg);color:var(--la-ink);font-family:var(--la-sans)}
body{display:flex;flex-direction:column}
header{padding:12px 20px;border-bottom:1px solid var(--la-line);display:flex;gap:16px;align-items:center;background:var(--la-panel)}
header a{color:var(--la-accent);text-decoration:none;font-size:13px}
header h1{font-size:14px;margin:0;font-weight:600}
/* Debug page (ADR-0011): a pure slot grid — content comes from plugins. */
#slot-main{flex:1;overflow-y:auto;padding:16px 20px 40px;min-height:0}
</style>
</head>
<body>
<header>
  <a href="/">← Chat</a>
  <h1>Session trace</h1>
</header>
<div id="slot-main" class="panel-root"></div>
<script type="module" src="/app/trace-page.js"></script>
</body>
</html>
