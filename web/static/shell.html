<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>lite agent</title>
<!-- Inline data-URI icon: avoids a /favicon.ico 404 in the console (BUG-11). -->
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="3" fill="%230f1115"/><circle cx="5.5" cy="8" r="2.6" fill="%237aa2f7"/><path d="M9 6.5l3-2v7l-3-2z" fill="%239ece6a"/></svg>'/>
<style>
:root {
  /* Design tokens (ADR-0010): Panel Components consume these across the
     Shadow DOM boundary. Core contract: bg/panel/ink/dim/line/accent. */
  --la-bg:#0f1115; --la-panel:#161a22; --la-panel2:#12161f; --la-ink:#e8eaed; --la-dim:#9aa0a6;
  --la-accent:#7aa2f7; --la-line:#2a2f3a; --la-err:#f7768e; --la-ok:#9ece6a; --la-stop:#f7768e;
  --la-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --la-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--la-bg);color:var(--la-ink);font-family:var(--la-sans)}

/* ADR-0031: Shell provides five generic regions — top/bottom + left|center|right.
   Domain faces (chat, trace, rail, …) are plugin Panel Components. */
#app{
  display:grid;
  grid-template-columns:220px minmax(0,1fr) 240px;
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:
    "top top top"
    "left center right"
    "bottom bottom bottom";
  height:100%;
  min-height:0;
  min-width:960px;
}

#region-top{
  grid-area:top;
  display:flex;flex-direction:column;min-height:0;
  background:var(--la-panel);
  border-bottom:1px solid var(--la-line);
}
#region-left{
  grid-area:left;
  display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;
  background:var(--la-panel2);
  border-right:1px solid var(--la-line);
}
#region-center{
  grid-area:center;
  display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;
}
#region-right{
  grid-area:right;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
  background:var(--la-panel2);
  border-left:1px solid var(--la-line);
}
#region-bottom{
  grid-area:bottom;
  display:flex;align-items:center;gap:0;min-height:26px;padding:0 10px;
  background:var(--la-panel);border-top:1px solid var(--la-line);
  color:var(--la-dim);font-size:11px;font-family:var(--la-mono,ui-monospace,monospace);
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;
}
/* Generic slot geometry only — any Panel Component in a region fills it. */
#region-left>*,#region-center>*,#region-right>*{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#region-top>*{flex:0 0 auto}
#region-bottom>*{flex:0 0 auto}
#region-bottom>*+*{border-left:1px solid var(--la-line);margin-left:10px;padding-left:10px}

/* Shell L0 chrome inside region-top (framework controls only — no domain panels). */
#shell-chrome{
  display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:36px;
  font-size:12px;color:var(--la-dim);
}
#shell-chrome .chrome-brand{font-weight:600;color:var(--la-ink);font-size:13px;flex:0 0 auto}
#layout-nav{display:flex;gap:10px;align-items:center}
#layout-nav a{color:var(--la-accent);text-decoration:none}
#shell-chrome .chrome-actions{margin-left:auto;display:flex;align-items:center;gap:0}
#status{flex:0 0 auto;color:var(--la-dim);font-family:var(--la-mono,monospace);font-size:11px;padding:0 6px}
#status:empty{display:none}
#status:not(:empty){border-left:1px solid var(--la-line);margin-left:8px;padding-left:8px}

.btn-plugins{background:transparent;border:1px solid var(--la-line);color:var(--la-dim);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;margin-left:8px}
.btn-plugins:hover{color:var(--la-accent);border-color:var(--la-accent)}

/* Shell-owned overlay for Settings / Plugin Graph — not a Layout slot. */
#main-overlay{position:fixed;inset:0;pointer-events:none;z-index:20}
#main-overlay:empty{display:none}
#main-overlay>*{pointer-events:auto}
.pg-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.pg-modal{background:var(--la-panel);border:1px solid var(--la-line);border-radius:12px;width:min(920px,100%);max-height:min(80vh,720px);display:flex;flex-direction:column;box-shadow:0 12px 24px rgba(0,0,0,.45);overflow:hidden}
.pg-modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--la-line);font-size:13px;font-weight:600}
.pg-modal-head button{background:transparent;border:1px solid var(--la-line);color:var(--la-dim);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.pg-modal-head button:hover{color:var(--la-ink);border-color:var(--la-accent)}
.pg-modal-body{flex:1;min-height:0;overflow:auto;display:flex}
</style>
</head>
<body>
<div id="app">
  <div id="region-top" class="region">
    <div id="shell-chrome">
      <span class="chrome-brand">lite agent</span>
      <span id="layout-nav"></span>
      <span class="chrome-actions">
        <button id="btn-plugins" class="btn-plugins" type="button" title="Mounted plugins &amp; dependency graph">Plugins</button>
        <button id="btn-settings" class="btn-plugins" type="button" title="Plugin settings">Settings</button>
        <span id="status"></span>
      </span>
    </div>
  </div>
  <div id="region-left" class="region panel-root"></div>
  <div id="region-center" class="region panel-root"></div>
  <div id="region-right" class="region panel-root"></div>
  <div id="region-bottom" class="region panel-root"></div>
</div>
<div id="main-overlay"></div>
<script src="/sdk/lite-agent.js"></script>
<script type="module" src="/app/main.js"></script>

</body>
</html>
