<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>lite agent</title>
<style>
:root {
  /* Design tokens (ADR-0010): Panel Components consume these across the
     Shadow DOM boundary. Core contract: bg/panel/ink/dim/line/accent. */
  --la-bg:#0f1115; --la-panel:#161a22; --la-panel2:#12161f; --la-ink:#e8eaed; --la-dim:#9aa0a6;
  --la-accent:#7aa2f7; --la-line:#2a2f3a; --la-err:#f7768e; --la-ok:#9ece6a; --la-stop:#f7768e;
  --la-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --la-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--la-bg);color:var(--la-ink);font-family:var(--la-sans)}

/* 3-column grid: history | (chat | trace) | plugins */
#app{
  display:grid;
  grid-template-columns:240px minmax(0,1fr) 240px;
  height:100%;
  min-height:0;
}
#rail{
  background:var(--la-panel2);
  border-right:1px solid var(--la-line);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
#rail-head{padding:12px;border-bottom:1px solid var(--la-line);display:flex;gap:8px;align-items:center}
#rail-head .brand{font-size:13px;font-weight:600;flex:1}
#btn-new{background:var(--la-accent);color:#0b1020;border:0;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer}
#session-list{flex:1;overflow-y:auto;padding:8px;min-height:0}
.sess-item{
  padding:8px 10px;border-radius:8px;font-size:12px;color:var(--la-dim);
  cursor:pointer;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sess-item:hover{background:#1a1f2a;color:var(--la-ink)}
.sess-item.active{background:#1a1f2a;color:var(--la-ink);border:1px solid var(--la-line)}

#right{
  background:var(--la-panel2);
  border-left:1px solid var(--la-line);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
#right-head{padding:12px;border-bottom:1px solid var(--la-line);font-size:12px;color:var(--la-dim)}
#slot-toolbar-right{flex:1;overflow-y:auto;padding:8px;min-height:0}

/* center workspace */
#center{display:flex;flex-direction:column;min-width:0;min-height:0}
#split{
  flex:1;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(280px,0.85fr);
  min-height:0;min-width:0;
}
#chat-col,#trace-col{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
#chat-col{border-right:1px solid var(--la-line)}
#pane-head{
  padding:10px 16px;border-bottom:1px solid var(--la-line);background:var(--la-panel);
  font-size:12px;color:var(--la-dim);display:flex;justify-content:space-between;align-items:center;flex-shrink:0
}
#pane-head a{color:var(--la-accent);text-decoration:none}
#chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 20px;min-height:0}
#trace-list{flex:1;overflow-y:auto;padding:6px 0;min-height:0}

#composer{
  display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--la-line);
  background:var(--la-panel);flex-shrink:0;align-items:flex-end
}
#input{
  flex:1;background:var(--la-bg);border:1px solid var(--la-line);color:var(--la-ink);
  border-radius:10px;padding:10px 12px;font:inherit;resize:none;min-height:44px;max-height:160px
}
#btn-send{
  background:var(--la-accent);color:#0b1020;border:0;border-radius:10px;
  padding:0 18px;height:44px;font-weight:700;cursor:pointer;font-size:13px;min-width:72px
}
#btn-send.running{background:var(--la-stop);color:#fff}
#status{font-size:12px;color:var(--la-dim);padding:2px 20px 0;min-height:16px;flex-shrink:0}

.trace-row{padding:6px 12px;font-size:12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;line-height:1.3}
.trace-row:hover{background:#1a1f2a}
.trace-row .t-kind{flex:0 0 72px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--la-dim);font-family:var(--la-mono)}
.trace-row .t-sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--la-ink)}
.trace-row .t-seq{flex:0 0 auto;font-size:10px;color:var(--la-dim);font-family:var(--la-mono)}
.trace-row.user .t-kind{color:#7aa2f7}
.trace-row.assistant .t-kind{color:var(--la-ok)}
.trace-row.system .t-kind{color:#bb9af7}
.trace-row.tool_call .t-kind{color:#e0af68}
.trace-row.tool_result .t-kind{color:#f7768e}
.trace-row.reasoning .t-kind{color:#bb9af7}
.trace-row.open{background:#1a1f2a}
.trace-detail{display:none;padding:4px 12px 10px 92px;font-size:11px;color:var(--la-dim);white-space:pre-wrap;font-family:var(--la-mono);border-bottom:1px solid var(--la-line)}
.trace-detail.open{display:block}

.msg{margin:0 0 14px;max-width:52rem}
.msg.user{color:var(--la-ink);background:var(--la-panel2);border-radius:10px;padding:10px 12px}
.msg.user:before{content:"you";display:block;color:var(--la-dim);font-size:11px;margin-bottom:4px}
.msg.assistant{line-height:1.55}
.msg.assistant pre{background:#0b0e14;border:1px solid var(--la-line);border-radius:8px;padding:10px;overflow:auto;font-family:var(--la-mono);font-size:13px}
.msg.assistant code{font-family:var(--la-mono);font-size:0.92em;background:#1a1f2a;padding:1px 4px;border-radius:4px}
.msg.assistant pre code{background:none;padding:0}
.msg.assistant h1,.msg.assistant h2,.msg.assistant h3{margin:0.6em 0 0.35em;line-height:1.25}
.msg.assistant ul{margin:0.3em 0;padding-left:1.2em}
.msg.assistant blockquote{border-left:3px solid var(--la-line);margin:0.4em 0;padding:0.1em 0 0.1em 0.8em;color:var(--la-dim)}

/* dsh-style disclosure rows: everything except user + final assistant is folded */
.disc{margin:0 0 8px;border:1px solid var(--la-line);border-radius:8px;background:var(--la-panel2);overflow:hidden}
.disc>summary{
  list-style:none;cursor:pointer;padding:7px 10px;font-size:12px;color:var(--la-dim);
  display:flex;gap:8px;align-items:center;user-select:none
}
.disc>summary::-webkit-details-marker{display:none}
.disc>summary:before{content:"▸";font-size:10px;color:var(--la-dim)}
.disc[open]>summary:before{content:"▾"}
.disc>summary .s-title{color:var(--la-ink);font-weight:600}
.disc>summary .s-meta{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--la-mono);font-size:11px}
.disc>.disc-body{padding:0 10px 10px 26px;font-size:12px;color:var(--la-dim);white-space:pre-wrap;font-family:var(--la-mono)}
.disc.think>summary:before{content:"▸"}
.disc.tool>summary .s-title{color:var(--la-accent)}
.disc.live{border-color:#334}
.disc.live>summary:before{content:"◉";color:var(--la-accent)}

.message{font-size:12px;margin:0 0 8px;color:var(--la-dim)}
.message.error{color:var(--la-err)}
.message.warn{color:#e0af68}
.progress{font-size:12px;color:var(--la-dim);font-family:var(--la-mono);margin-bottom:8px}
#main-overlay{position:fixed;inset:0;pointer-events:none;z-index:20}
#main-overlay:empty{display:none}
#main-overlay>*{pointer-events:auto}
</style>
</head>
<body>
<div id="app">
  <aside id="rail">
    <div id="rail-head">
      <span class="brand">lite agent</span>
      <button id="btn-new" title="New chat">＋</button>
    </div>
    <div id="session-list"></div>
  </aside>
  <section id="center">
    <div id="split">
      <section id="chat-col">
        <div id="pane-head"><span>Chat</span><span id="session-label" style="font-family:var(--la-mono);font-size:11px"></span></div>
        <div id="chat"></div>
        <div id="status"></div>
      </section>
      <section id="trace-col">
        <div id="pane-head"><span>Session trace</span><button id="btn-dump" title="Export session trace JSON" style="background:none;border:1px solid var(--la-line);color:var(--la-dim);border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer">dump</button><a href="/trace" target="_blank" rel="noreferrer">full ↗</a></div>
        <div id="trace-list"></div>
      </section>
    </div>
    <div id="composer">
      <textarea id="input" rows="2" placeholder="Message…  / for commands"></textarea>
      <button id="btn-send" title="Send">Send</button>
    </div>
  </section>
  <aside id="right">
    <div id="right-head">Panels</div>
    <div id="slot-toolbar-right" class="panel-root"></div>
  </aside>
</div>
<div id="main-overlay"></div>
<script src="/sdk/lite-agent.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous"/>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<script>
(function(){
  var chat = document.getElementById('chat');
  var statusEl = document.getElementById('status');
  var input = document.getElementById('input');
  var btnSend = document.getElementById('btn-send');
  var btnNew = document.getElementById('btn-new');
  var sessionList = document.getElementById('session-list');
  var sessionLabel = document.getElementById('session-label');
  var traceList = document.getElementById('trace-list');
  var streamBuf = '';
  var reasoningBuf = '';
  var progressEl = null, thinkingEl = null, liveEl = null, liveBody = null, liveMeta = null;
  var historyReady = false;
  var running = false;
  var currentSessionId = '';
  var BT = String.fromCharCode(96);
  var FENCE = BT+BT+BT;

  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function nearBottom(){
    return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 56;
  }
  // Stick to bottom only when the user is already near it (don't yank mid-read).
  function scrollChat(force){
    if(force || nearBottom()) chat.scrollTop = chat.scrollHeight;
  }

  function sameSession(sid){
    // Missing sessionId means the default Session (""), not "any session".
    if(sid === undefined || sid === null) return !currentSessionId;
    return String(sid) === String(currentSessionId || '');
  }

  function setRunning(on, sid){
    var show = !!on && sameSession(sid);
    running = show;
    btnSend.classList.toggle('running', show);
    btnSend.textContent = show ? 'Stop' : 'Send';
    btnSend.title = show ? 'Stop generation' : 'Send';
  }

  function renderMath(root){
    if(!window.katex || !window.renderMathInElement) return;
    try {
      window.renderMathInElement(root || chat, {
        delimiters: [
          {left:'$$', right:'$$', display:true},
          {left:'\\[', right:'\\]', display:true},
          {left:'$', right:'$', display:false},
          {left:'\\(', right:'\\)', display:false}
        ],
        throwOnError: false
      });
    } catch(e){}
  }

  function md(src){
    if(!src) return '';
    var s = String(src).replace(/\r\n/g,'\n');
    var fenceRe = new RegExp(FENCE+'([\\\\w-]*)\\\\n([\\\\s\\\\S]*?)'+FENCE,'g');
    s = s.replace(fenceRe, function(_,lang,code){ return '<pre><code>'+esc(code)+'</code></pre>'; });
    s = s.replace(/^### (.*)$/gm,'<h3>$1</h3>');
    s = s.replace(/^## (.*)$/gm,'<h2>$1</h2>');
    s = s.replace(/^# (.*)$/gm,'<h1>$1</h1>');
    s = s.replace(/^---$/gm,'<hr/>');
    s = s.replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>');
    s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    var codeRe = new RegExp(BT+'([^'+BT+']+)'+BT,'g');
    s = s.replace(codeRe,'<code>$1</code>');
    s = s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');
    s = s.replace(/^(?:- |\* )(.*)(?:\n(?:- |\* ).*)*/gm, function(block){
      var items = block.split(/\n/).map(function(l){return l.replace(/^(?:- |\* )/,'');}).map(function(t){return '<li>'+t+'</li>';}).join('');
      return '<ul>'+items+'</ul>';
    });
    return s.split(/\n{2,}/).map(function(p){
      p = p.trim();
      if(!p) return '';
      if(/^<(h\d|ul|pre|blockquote|hr)/.test(p)) return p;
      return '<p>'+p.replace(/\n/g,'<br/>')+'</p>';
    }).join('\n');
  }

  function appendAssistant(html){
    var el = document.createElement('div');
    el.className = 'msg assistant';
    el.innerHTML = html || '';
    chat.appendChild(el); renderMath(el); scrollChat(true); return el;
  }
  function appendUser(text){
    var el = document.createElement('div');
    el.className = 'msg user';
    el.textContent = text;
    chat.appendChild(el); scrollChat(true);
  }
  function appendPre(text, cls){
    var el = document.createElement('pre');
    el.className = cls || 'message';
    el.style.cssText = 'white-space:pre-wrap;font-family:var(--la-mono);font-size:12px';
    el.textContent = text;
    chat.appendChild(el); scrollChat(true);
  }
  function clearProgress(){ if(progressEl){ progressEl.remove(); progressEl = null; } }
  function clearThinking(){
    if(thinkingEl){ thinkingEl.remove(); thinkingEl = null; }
    reasoningBuf = '';
  }

  // dsh-style disclosure row
  function makeDisc(cls, title, meta, bodyText, open){
    var d = document.createElement('details');
    d.className = 'disc ' + (cls||'');
    if(open) d.open = true;
    var sum = document.createElement('summary');
    var t = document.createElement('span');
    t.className = 's-title';
    t.textContent = title;
    var m = document.createElement('span');
    m.className = 's-meta';
    m.textContent = meta || '';
    sum.appendChild(t); sum.appendChild(m);
    var body = document.createElement('div');
    body.className = 'disc-body';
    body.textContent = bodyText || '';
    d.appendChild(sum); d.appendChild(body);
    return d;
  }

  // Reasoning channel → Thinking disclosure (live).
  function setThinkingText(t){
    if(!thinkingEl){
      thinkingEl = makeDisc('think live', 'Thinking', '', '', true);
      chat.appendChild(thinkingEl);
    }
    var body = thinkingEl.querySelector('.disc-body');
    var meta = thinkingEl.querySelector('.s-meta');
    if(body) body.textContent = t;
    if(meta) meta.textContent = t.length>60 ? t.slice(0,60)+'…' : t;
    scrollChat();
  }
  function freezeThinking(){
    if(thinkingEl){
      thinkingEl.classList.remove('live');
      thinkingEl.open = false;
      thinkingEl = null;
    }
    reasoningBuf = '';
  }

  // Content stream → live Answer draft. Settle may replace it.
  function ensureLive(){
    if(thinkingEl) freezeThinking();
    if(!liveEl){
      liveEl = makeDisc('think live', 'Answer', '', '', true);
      chat.appendChild(liveEl);
      liveBody = liveEl.querySelector('.disc-body');
      liveMeta = liveEl.querySelector('.s-meta');
    }
    return liveEl;
  }
  function setLiveText(t){
    ensureLive();
    if(liveBody) liveBody.textContent = t;
    if(liveMeta) liveMeta.textContent = (t.length>60 ? t.slice(0,60)+'…' : t);
    scrollChat();
  }
  function removeLive(){
    if(liveEl){ liveEl.remove(); liveEl=null; liveBody=null; liveMeta=null; }
    streamBuf = '';
  }
  // Keep stream as collapsed Think (unless empty).
  function freezeLive(){
    if(liveEl && streamBuf){
      liveEl.classList.remove('live');
      liveEl.open = false;
      liveEl = null; liveBody = null; liveMeta = null;
      streamBuf = '';
      return;
    }
    removeLive();
    clearThinking();
  }

  function clearTurnUI(){
    clearProgress(); clearThinking();
    if(liveEl) freezeLive();
    else removeLive();
  }

  function onPresentation(raw){
    clearProgress();
    var data = raw && raw.kind !== undefined ? raw : (raw && raw.data) || raw || {};
    var kind = data.kind || data.Kind;
    var text = data.text !== undefined ? data.text : data.Text;
    var sid = data.sessionId !== undefined ? data.sessionId : data.SessionID;
    // Host Loop always tags sessionId ("" = default). Ignore foreign Session paints.
    if(sid !== undefined && sid !== null && !sameSession(sid)) return;
    if(kind === 'markdown_text'){
      // Final assistant body is always expanded. Drop live stream if it was the same answer.
      var settled = (text || '').trim();
      if(streamBuf && settled && streamBuf.replace(/\s+/g,' ').indexOf(settled.slice(0,40).replace(/\s+/g,' '))>=0){
        removeLive(); // stream was the answer — avoid double print
      } else {
        freezeLive(); // keep as Think disclosure
      }
      freezeThinking();
      appendAssistant(md(text || ''));
      return;
    }
    if(kind === 'message_text'){
      var level = data.level || data.Level || '';
      // Non-final status: fold as dim one-liner disclosure (dsh-like).
      freezeLive();
      var row = makeDisc('', 'status', text || '', '', false);
      if(level === 'error') row.style.borderColor = 'var(--la-err)';
      chat.appendChild(row); scrollChat();
      return;
    }
    if(kind === 'summary_text'){
      freezeLive();
      var pairsArr = data.pairs || data.Pairs || [];
      var title = data.title !== undefined ? data.title : data.Title;
      var detail = data.detail !== undefined ? data.detail : data.Detail;
      var meta = pairsArr.map(function(p){
        var k = p.key !== undefined ? p.key : p.Key;
        var v = p.value !== undefined ? p.value : p.Value;
        return k+'='+String(v).slice(0,40);
      }).join('  ');
      var body = pairsArr.map(function(p){
        var k = p.key !== undefined ? p.key : p.Key;
        var v = p.value !== undefined ? p.value : p.Value;
        return k+': '+v;
      }).join('\n');
      if(detail) body += (body?'\n\n':'') + detail;
      var card = makeDisc('tool', '⏺ '+(title||'tool'), meta, body, false);
      chat.appendChild(card); scrollChat();
    }
  }

  function traceSummary(f){
    var t = f.type || '';
    var role = f.role || '';
    if(t === 'message') return (role||'msg') + ' · ' + String(f.content||'').replace(/\s+/g,' ').slice(0,80);
    if(t === 'reasoning') return 'thinking · ' + String(f.content||'').replace(/\s+/g,' ').slice(0,80);
    if(t === 'tool_call'){
      var names = ((f.meta&&f.meta.tool_calls)||[]).map(function(tc){return tc.name;}).join(',');
      return 'call ' + (names||'?');
    }
    if(t === 'tool_result') return 'result · ' + String(f.content||'').replace(/\s+/g,' ').slice(0,80);
    if(t === 'request_header') return 'llm request';
    if(t === 'step_start') return 'step ' + ((f.meta&&f.meta.step)||'');
    if(t === 'step_end') return 'step end · ' + ((f.meta&&f.meta.reason)||'');
    if(t === 'turn_start') return 'turn start';
    if(t === 'turn_end') return 'turn end · ' + ((f.meta&&f.meta.reason)||'');
    return t;
  }

  function shortSid(sid){
    var s = String(sid === undefined || sid === null ? '' : sid);
    if(!s) return '·';
    return s.length > 8 ? s.slice(0,8) : s;
  }

  function factBelongs(f){
    if(!f) return false;
    return sameSession(f.sessionId);
  }

  function appendTraceFact(f){
    if(!f || !f.type) return;
    if(!factBelongs(f)) return;
    var t = f.type;
    var role = f.role || '';
    var cls = t === 'message' && role ? role : t;
    var row = document.createElement('div');
    row.className = 'trace-row ' + cls;
    var kind = t === 'message' ? (role||'msg') : t;
    row.innerHTML = '<span class="t-kind">'+esc(kind)+'</span><span class="t-sum">'+esc(traceSummary(f))+'</span><span class="t-seq">'+esc(shortSid(f.sessionId))+' #'+(f.seq||'')+'</span>';
    var det = document.createElement('div');
    det.className = 'trace-detail';
    var detail = f.content || '';
    if(f.sessionId !== undefined) detail = 'sessionId: '+(f.sessionId||'(default)')+'\n\n'+detail;
    if(f.meta) detail += (detail?'\n\n':'') + JSON.stringify(f.meta, null, 2);
    det.textContent = detail || '(empty)';
    row.onclick = function(){ row.classList.toggle('open'); det.classList.toggle('open'); };
    traceList.appendChild(row); traceList.appendChild(det);
    traceList.scrollTop = traceList.scrollHeight;
  }

  // Consecutive type=reasoning facts (legacy fragmented flushes) become one Thinking row.
  function mergeReasoningFacts(facts){
    var out = [];
    for(var i=0;i<facts.length;i++){
      var f = facts[i];
      if(!f || f.type !== 'reasoning'){ out.push(f); continue; }
      var parts = [];
      var meta = f.meta;
      var seq = f.seq;
      var sid = f.sessionId;
      while(i < facts.length && facts[i] && facts[i].type === 'reasoning'){
        if(facts[i].content) parts.push(facts[i].content);
        if(facts[i].meta) meta = facts[i].meta;
        if(facts[i].seq !== undefined) seq = facts[i].seq;
        if(facts[i].sessionId !== undefined) sid = facts[i].sessionId;
        i++;
      }
      i--;
      out.push({type:'reasoning', role:f.role||'assistant', content:parts.join(''), meta:meta, seq:seq, sessionId:sid});
    }
    return out;
  }

  function dumpTrace(){
    fetch('/api/trace').then(function(r){return r.json();}).then(function(b){
      var sid = b.sessionId !== undefined && b.sessionId !== null ? b.sessionId : (currentSessionId || '');
      var payload = {
        exportedAt: new Date().toISOString(),
        sessionId: sid,
        currentViewSessionId: currentSessionId || '',
        facts: b.facts || []
      };
      var name = 'trace-' + (sid || 'default') + '-' + new Date().toISOString().replace(/[:.]/g,'-') + '.json';
      var blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      appendPre('dumped ' + (b.facts||[]).length + ' facts → ' + name, 'message');
    }).catch(function(e){ appendPre('dump failed: ' + e, 'message error'); });
  }

  function loadTrace(){
    fetch('/api/trace').then(function(r){return r.json();}).then(function(b){
      var facts = mergeReasoningFacts(b.facts || []);
      if(b.sessionId) sessionLabel.textContent = b.sessionId;
      traceList.innerHTML = '';
      facts.forEach(appendTraceFact);
      traceList.scrollTop = traceList.scrollHeight;
    }).catch(function(){});
  }

  function loadSessions(){
    fetch('/api/sessions').then(function(r){return r.json();}).then(function(b){
      var cur = b.current || '';
      var list = b.sessions || [];
      sessionList.innerHTML = '';
      if(!list.length){
        var empty = document.createElement('div');
        empty.className = 'sess-item';
        empty.textContent = 'No sessions yet';
        sessionList.appendChild(empty);
        return;
      }
      list.forEach(function(s){
        var id = s.id || '';
        var title = s.title || id;
        var el = document.createElement('div');
        el.className = 'sess-item' + (id === cur ? ' active' : '');
        el.textContent = title;
        el.title = id;
        el.onclick = function(){ selectSession(id); };
        sessionList.appendChild(el);
      });
    }).catch(function(){});
  }

  function selectSession(id){
    fetch('/api/session/select', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({sessionId:id})})
      .then(function(r){return r.json();}).then(function(b){
        setSessionId(id);
        sessionLabel.textContent = id || '(default)';
        historyReady = false;
        clearTurnUI();
        setRunning(false);
        return loadHistory();
      }).then(function(){
        historyReady = true;
        loadTrace(); loadSessions(); refreshRunState();
      });
  }

  function refreshRunState(){
    fetch('/api/session').then(function(r){return r.json();}).then(function(b){
      if(b.sessionId !== undefined) setSessionId(b.sessionId);
      if(currentSessionId) sessionLabel.textContent = currentSessionId;
      setRunning(b.status === 'running', currentSessionId);
      // Mid-run switch/refresh: resume live Thinking from rebuilt facts.
      if(b.status === 'running' && !thinkingEl && !liveEl){
        var thinks = chat.querySelectorAll('details.think:not(.live) .disc-body');
        if(thinks.length){
          reasoningBuf = thinks[thinks.length-1].textContent || '';
        }
      }
    }).catch(function(){});
  }

  function loadHistory(){
    return fetch('/api/history').then(function(r){return r.json();}).then(function(b){
      chat.innerHTML = '';
      // Prefer Session Log facts so Thinking/tools survive refresh & session switch.
      var facts = mergeReasoningFacts(b.facts || []);
      if(facts.length){
        facts.forEach(renderHistoryFact);
      } else {
        (b.messages||[]).forEach(function(m){
          if(m.role === 'user') appendUser(m.content);
          else if(m.role === 'assistant') appendAssistant(md(m.content));
        });
      }
      historyReady = true;
      scrollChat(true);
    }).catch(function(){ historyReady = true; });
  }

  function renderHistoryFact(f){
    if(!f || !f.type) return;
    var t = f.type;
    if(t === 'message'){
      if(f.role === 'user' && f.content) appendUser(f.content);
      else if(f.role === 'assistant' && f.content) appendAssistant(md(f.content));
      return;
    }
    if(t === 'reasoning'){
      var body = f.content || '';
      if(!body) return;
      var step = (f.meta && f.meta.step) || '';
      var row = makeDisc('think', 'Thinking', step ? 'step '+step : '', body, false);
      chat.appendChild(row);
      return;
    }
    if(t === 'tool_call'){
      var names = ((f.meta && f.meta.tool_calls) || []).map(function(tc){return tc.name;}).join(',');
      var card = makeDisc('tool', '⏺ '+(names||'tool'), '', f.content || names || '', false);
      chat.appendChild(card);
      return;
    }
    if(t === 'tool_result'){
      var res = makeDisc('tool', '⏺ result', '', f.content || '', false);
      chat.appendChild(res);
    }
  }

  // ---- Panel Components (ADR-0010) ----
  // set = remount by id (new element + property-assigned props); clear = remove by id.
  // Ops may arrive before the entry module loads; the custom element upgrade
  // then wires the already-inserted element without losing props.
  function panelHost(slot){
    if(slot === 'sidebar') return document.getElementById('rail');
    if(slot === 'main-overlay') return document.getElementById('main-overlay');
    return document.getElementById('slot-toolbar-right');
  }
  function applyPanel(op){
    if(!op || !op.id) return;
    var node = document.getElementById('panel-'+op.id);
    if(op.op === 'clear'){ if(node) node.remove(); return; }
    if(!op.component) return;
    if(node) node.remove();
    node = document.createElement(op.component);
    node.id = 'panel-'+op.id;
    node.className = 'panel-root';
    node.style.display = 'block';
    if(op.props !== undefined && op.props !== null){
      try { node.props = (typeof op.props === 'string') ? JSON.parse(op.props) : op.props; }
      catch(e){ node.props = {}; }
    }
    var host = panelHost(op.slot);
    if(host) host.appendChild(node);
  }

  // Session channel for components (LiteAgent.onSessionChange rides on this).
  function setSessionId(id){
    id = id || '';
    if(window.__liteSessionId === id && currentSessionId === id) return;
    currentSessionId = id;
    window.__liteSessionId = id;
    if(window.LiteAgent && window.LiteAgent.emit) window.LiteAgent.emit('__session', id);
  }

  // Import every mounted plugin's UI Entry and apply its static mounts.
  // Query params: plugin name (components derive it from import.meta.url)
  // and version (cache-busting across plugin upgrades).
  function loadPluginUIs(){
    fetch('/api/plugins').then(function(r){return r.json();}).then(function(b){
      (b.plugins||[]).forEach(function(p){
        if(!p.ui || !p.ui.entry) return;
        var url = p.ui.entry + '?plugin=' + encodeURIComponent(p.name) + '&v=' + encodeURIComponent(p.version||'');
        import(url).then(function(){
          (p.ui.mounts||[]).forEach(function(m){
            applyPanel({op:'set', slot:m.slot, id:m.component, component:m.component, props:m.props});
          });
        }).catch(function(e){
          appendPre('plugin ui failed: ' + p.name + ' ' + e, 'message error');
        });
      });
    }).catch(function(){});
  }

  function applySSE(env){
    if(!historyReady && env.topic !== 'panel') return;
    var topic = env.topic;
    var d = env.data !== undefined ? env.data : env;
    // Fan live events out to Panel Components subscribed via LiteAgent.on.
    if(window.LiteAgent && window.LiteAgent.emit) window.LiteAgent.emit(topic, d);
    if(topic === 'presentation'){ onPresentation(d); return; }
    if(topic === 'panel'){ applyPanel(d); return; }
    if(topic === 'stream'){
      if(!sameSession(d.sessionId)) return;
      if(d.channel === 'reasoning'){
        reasoningBuf += d.delta || '';
        setThinkingText(reasoningBuf);
      } else {
        streamBuf += d.delta || '';
        setLiveText(streamBuf);
      }
      return;
    }
    if(topic === 'session'){
      if(!sameSession(d.sessionId)) return;
      appendTraceFact(d);
      return;
    }
    if(topic === 'status'){
      var st = d.status || '';
      var sid = d.sessionId !== undefined ? d.sessionId : '';
      if(st.indexOf('session:')===0){
        statusEl.textContent = st;
        return;
      }
      if(st === 'running'){
        statusEl.textContent = 'running';
        setRunning(true, sid);
        return;
      }
      if(st === 'idle' || st.indexOf('error:')===0 || st === 'cancelling'){
        statusEl.textContent = st;
        if(sameSession(sid)){
          setRunning(false);
          clearTurnUI();
        }
        if(st === 'idle' || st.indexOf('error:')===0) loadSessions();
      }
    }
  }

  function openSSE(){
    // No replay: history/trace rehydrate durable state; SSE is live-only so
    // refresh does not double-paint old presentation events.
    var es = new EventSource('/events');
    es.addEventListener('presentation', function(e){ applySSE(JSON.parse(e.data)); });
    es.addEventListener('panel', function(e){ applySSE(JSON.parse(e.data)); });
    es.addEventListener('stream', function(e){ applySSE(JSON.parse(e.data)); });
    es.addEventListener('session', function(e){ applySSE(JSON.parse(e.data)); });
    es.addEventListener('status', function(e){ applySSE(JSON.parse(e.data)); });
    es.onerror = function(){ statusEl.textContent = 'sse reconnecting…'; };
  }

  function sendOrStop(){
    if(running){
      fetch('/api/turn/cancel', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({sessionId: currentSessionId})})
        .then(function(){ setRunning(false); });
      return;
    }
    var text = input.value.trim();
    if(!text) return;
    input.value = '';
    if(text.charAt(0) === '/'){
      appendUser(text);
      fetch('/api/command', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({line:text})})
        .then(function(r){return r.json();})
        .then(function(body){
          if(body.error) appendPre(body.error, 'message error');
          else if(body.output) appendPre(body.output, 'message');
          // /refresh rescans manifests server-side; plugin code may have
          // changed, and module identities can't be swapped in place — the
          // Session Log is the truth, so reload rebuilds everything (ADR-0010).
          var cmd = text.replace(/^\//,'').split(/\s+/)[0];
          if(cmd === 'refresh'){
            location.reload();
          }
        });
      return;
    }
    appendUser(text);
    streamBuf = '';
    if(liveEl){ liveEl.remove(); liveEl = null; }
    clearThinking(); clearProgress();
    setRunning(true, currentSessionId);
    fetch('/api/message', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text:text, sessionId: currentSessionId})})
      .then(function(r){return r.json();})
      .then(function(b){
        if(b && b.ok === false){
          setRunning(false);
          appendPre(b.error || 'send failed', 'message error');
        }
      }).catch(function(){ setRunning(false); });
  }

  btnSend.onclick = sendOrStop;
  var btnDump = document.getElementById('btn-dump');
  if(btnDump) btnDump.onclick = dumpTrace;
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendOrStop(); }
  });
  btnNew.onclick = function(){
    fetch('/api/session/new', {method:'POST'}).then(function(r){return r.json();}).then(function(b){
      if(!b.ok){ appendPre(b.error||'new session failed','message error'); return; }
      setSessionId(b.sessionId);
      sessionLabel.textContent = b.sessionId || '(default)';
      chat.innerHTML = '';
      streamBuf = '';
      if(liveEl){ liveEl.remove(); liveEl=null; }
      clearThinking(); clearProgress();
      setRunning(false);
      historyReady = true;
      loadTrace(); loadSessions(); refreshRunState();
      appendPre('new session ' + (b.sessionId||''), 'message');
    });
  };

  // History first, then live SSE (avoids replay double-paint on refresh).
  loadSessions();
  loadPluginUIs();
  loadHistory().then(function(){ loadTrace(); refreshRunState(); openSSE(); });
})();
</script>
</body>
</html>
