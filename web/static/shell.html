<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>lite agent</title>
<style>
:root {
  /* Design tokens (ADR-0010): Panel Components consume these across the
     Shadow DOM boundary. Core contract: bg/panel/ink/dim/line/accent. */
  --la-bg:#0f1115; --la-panel:#161a22; --la-panel2:#12161f; --la-ink:#e8eaed; --la-dim:#9aa0a6;
  --la-accent:#7aa2f7; --la-line:#2a2f3a; --la-err:#f7768e; --la-ok:#9ece6a; --la-stop:#f7768e;
  --la-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --la-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--la-bg);color:var(--la-ink);font-family:var(--la-sans)}

/* 3-column grid: history | (chat | trace) | plugins */
#app{
  display:grid;
  grid-template-columns:240px minmax(0,1fr) 240px;
  height:100%;
  min-height:0;
}
#rail{
  background:var(--la-panel2);
  border-right:1px solid var(--la-line);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}

#right{
  background:var(--la-panel2);
  border-left:1px solid var(--la-line);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
#right-head{padding:12px;border-bottom:1px solid var(--la-line);font-size:12px;color:var(--la-dim)}
#slot-toolbar-right{flex:1;overflow-y:auto;padding:8px;min-height:0}

/* center workspace */
#center{display:flex;flex-direction:column;min-width:0;min-height:0}
#split{
  flex:1;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(280px,0.85fr);
  min-height:0;min-width:0;
}
#chat-col,#trace-col{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
#chat-col{border-right:1px solid var(--la-line)}
#pane-head{
  padding:10px 16px;border-bottom:1px solid var(--la-line);background:var(--la-panel);
  font-size:12px;color:var(--la-dim);display:flex;justify-content:space-between;align-items:center;flex-shrink:0
}
#pane-head a{color:var(--la-accent);text-decoration:none}
/* The chat surface is the session-view Panel Component (ADR-0011);
   the layout owns sizing, the component owns scrolling and content. */
#chat{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#chat>session-view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#slot-trace{flex:1;overflow-y:auto;padding:6px 0;min-height:0}
#status{font-size:12px;color:var(--la-dim);padding:2px 20px 0;min-height:16px;flex-shrink:0}

#main-overlay{position:fixed;inset:0;pointer-events:none;z-index:20}
#main-overlay:empty{display:none}
#main-overlay>*{pointer-events:auto}
/* Floating plugin-graph modal (shell-owned, not a layout page). */
.pg-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.pg-modal{background:var(--la-panel);border:1px solid var(--la-line);border-radius:12px;width:min(920px,100%);max-height:min(80vh,720px);display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.45);overflow:hidden}
.pg-modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--la-line);font-size:13px;font-weight:600}
.pg-modal-head button{background:transparent;border:1px solid var(--la-line);color:var(--la-dim);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
.pg-modal-head button:hover{color:var(--la-ink);border-color:var(--la-accent)}
.pg-modal-body{flex:1;min-height:0;overflow:auto;display:flex}
.btn-plugins{background:transparent;border:1px solid var(--la-line);color:var(--la-dim);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;margin-left:8px}
.btn-plugins:hover{color:var(--la-accent);border-color:var(--la-accent)}
</style>
</head>
<body>
<div id="app">
  <aside id="rail" class="panel-root"></aside>
  <section id="center">
    <div id="split">
      <section id="chat-col">
        <div id="pane-head"><span>Chat</span><span id="layout-nav" style="display:flex;gap:10px;margin-left:12px;align-items:center"></span><span style="display:flex;align-items:center"><button id="btn-plugins" class="btn-plugins" type="button" title="Mounted plugins & dependency graph">Plugins</button><button id="btn-settings" class="btn-plugins" type="button" title="Plugin settings">Settings</button><span id="session-label" style="font-family:var(--la-mono);font-size:11px;margin-left:8px"></span></span></div>
        <div id="chat" class="panel-root"></div>
        <div id="status"></div>
      </section>
      <section id="trace-col">
        <div id="pane-head"><span>Session trace</span><a href="/trace" target="_blank" rel="noreferrer">full ↗</a></div>
        <div id="slot-trace" class="panel-root"></div>
      </section>
    </div>
  </section>
  <aside id="right">
    <div id="right-head">Panels</div>
    <div id="slot-toolbar-right" class="panel-root"></div>
  </aside>
</div>
<div id="main-overlay"></div>
<script src="/sdk/lite-agent.js"></script>
<script type="module" src="/app/main.js"></script>

</body>
</html>
